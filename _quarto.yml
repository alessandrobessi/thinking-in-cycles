# Quarto book scaffold. Lives at the repo root (not in publish/) because
# Quarto book projects cannot render chapter content reached via '../'
# parent-directory paths -- confirmed directly: an earlier version of
# this file lived in publish/ and referenced ../book/... paths, which
# rendered every chapter's title into the console progress list but
# silently produced empty/missing output for all of them except the
# project's own index.md. Moving _quarto.yml here, so every chapter path
# below is a genuine subdirectory of the project root, fixed it -- see
# ROADMAP.md's Quarto-render entry for the full story. Output still
# lands in publish/_book (below), keeping publish/ as "where the built
# book lives" per BLUEPRINT.md Section 20.
#
# All thirty chapters across all six Parts, plus Appendices A-G, are
# listed below -- the full manuscript.

project:
  type: book
  output-dir: publish/_book

book:
  title: "Thinking in Cycles"
  subtitle: "A Mental Model for Linux Performance"
  author: "Alessandro Bessi"
  chapters:
    - index.md
    - book/preface.md
    - part: "Part I — Measuring Reality"
      chapters:
        - book/part-1-measuring-reality/chapter-01-why-fast-looking-code-runs-slowly.md
        - book/part-1-measuring-reality/chapter-02-performance-is-a-question-not-a-number.md
        - book/part-1-measuring-reality/chapter-03-latency-throughput-utilization-saturation.md
        - book/part-1-measuring-reality/chapter-04-noise-variance-and-honest-benchmarks.md
        - book/part-1-measuring-reality/chapter-05-the-performance-investigation-loop.md
    - part: "Part II — What the CPU Is Doing"
      chapters:
