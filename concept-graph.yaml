# Machine-readable concept dependency graph for "Thinking in Cycles".
# Source of truth for term lists: BLUEPRINT.md Section 11 (Concept Dependency
# Graph) and Section 12 (Narrative Graph). Levels are ordered: a chapter may
# assume any concept whose level is lower than (or equal to and already
# introduced within) its own.
#
# `introduced_in_chapter: null` means the concept has not yet been formally
# taught by any drafted chapter (Chapters 1-30, as of this revision -- the
# full book is now drafted).
# `also_appears_in` records informal/operational use before formal
# introduction, which BLUEPRINT.md itself does in a few places (see the
# "known tensions" note at the bottom and concept-graph.md for discussion).
#
# This schema deliberately encodes level-ordering only, not a per-term
# dependency DAG -- BLUEPRINT.md Section 11 does not specify finer-grained
# edges than "no chapter may rely on a concept before its prerequisites have
# been introduced" at the level granularity.

version: 1

levels:
  - level: 0
    name: "Questions and Measurements"
    concepts:
      - name: workload
        introduced_in_chapter: 1
      - name: metric
        introduced_in_chapter: null
      - name: latency
        introduced_in_chapter: 3
      - name: throughput
        introduced_in_chapter: 3
      - name: utilization
        introduced_in_chapter: 3
      - name: saturation
        introduced_in_chapter: 3
      - name: variance
        introduced_in_chapter: 4
        note: "Chapter title concept; not in Ch4's literal 'Introduces' line but covered throughout."
      - name: distribution
        introduced_in_chapter: 4
      - name: baseline
        introduced_in_chapter: 5
      - name: experiment
        introduced_in_chapter: 5
        note: "Informal throughout Ch1-4 benchmarks; formalized as part of the investigation loop in Ch5."
      - name: confounder
        introduced_in_chapter: 4
      - name: measurement overhead
        introduced_in_chapter: null

  - level: 1
    name: "Linux Execution"
    concepts:
      - name: process
        introduced_in_chapter: null
        also_appears_in: [1, 21]
        note: "Used informally from Chapter 1 onward; never given a dedicated formal definition of its own."
      - name: thread
        introduced_in_chapter: null
        also_appears_in: [1, 5, 8, 21, 22]
      - { name: runnable, introduced_in_chapter: 21 }
      - { name: running, introduced_in_chapter: 21 }
      - { name: sleeping, introduced_in_chapter: 21 }
      - { name: blocked, introduced_in_chapter: 21 }
      - { name: scheduler, introduced_in_chapter: 21 }
      - { name: run queue, introduced_in_chapter: 21 }
      - name: context switch
        introduced_in_chapter: 22
        note: "Introduced via 'voluntary context switch'/'involuntary context switch' in Chapter 22's New Concepts (informally previewed as a counter in Chapter 21)."
      - name: CPU migration
        introduced_in_chapter: 22
        note: "Introduced as 'migration' in Chapter 22's New Concepts."
      - name: user time
        introduced_in_chapter: null
        also_appears_in: [1]
        note: "Ch1's guided lab compares user/system/wall time operationally, without formal scheduler treatment."
      - name: system time
        introduced_in_chapter: null
        also_appears_in: [1]
      - name: wall time
        introduced_in_chapter: null
        also_appears_in: [1]

  - level: 2
    name: "CPU Work"
    concepts:
      - name: instruction
        introduced_in_chapter: 6
        note: "Introduced as 'machine instruction' in Chapter 6's New Concepts."
      - { name: cycle, introduced_in_chapter: 7 }
      - { name: retired instruction, introduced_in_chapter: 6 }
      - { name: IPC, introduced_in_chapter: 7 }
      - { name: CPI, introduced_in_chapter: 7 }
      - name: pipeline
        introduced_in_chapter: 8
        note: "Named in Chapter 8's title and Core Intuition; front end/back end (its two halves) are Chapter 8's formal New Concepts entries."
      - { name: front end, introduced_in_chapter: 8 }
      - { name: back end, introduced_in_chapter: 8 }
      - name: branch prediction
        introduced_in_chapter: 9
        note: "Introduced via 'branch predictor' in Chapter 9's New Concepts."
      - name: speculation
        introduced_in_chapter: 9
        note: "Introduced via 'speculative execution' in Chapter 9's New Concepts."
      - { name: dependency, introduced_in_chapter: 8 }
      - { name: stall, introduced_in_chapter: 8 }
      - { name: PMU, introduced_in_chapter: 10 }
      - name: hardware performance event
        introduced_in_chapter: 10
        note: "Introduced as 'hardware event' in Chapter 10's New Concepts."
      - { name: multiplexing, introduced_in_chapter: 10 }

  - level: 3
    name: "Profiling"
    concepts:
      - name: counter
        introduced_in_chapter: 11
        also_appears_in: [10]
        note: "Chapter 10 used 'counter' operationally (PMU counters, perf stat) before Chapter 11 formally contrasts counting with sampling and tracing as three observation models."
      - { name: sampling, introduced_in_chapter: 11 }
      - { name: tracing, introduced_in_chapter: 11 }
      - name: sample frequency
        introduced_in_chapter: 12
        note: "Introduced via Chapter 12's separate 'sample' and 'frequency' New Concepts entries."
      - name: call stack
        introduced_in_chapter: 12
        also_appears_in: [11, 13]
        note: "Used from Chapter 11 onward; first substantively built on via 'call graph' (a tree of call stacks) in Chapter 12."
      - name: symbol
        introduced_in_chapter: 13
        note: "Introduced as 'symbol table' in Chapter 13's New Concepts."
      - { name: debug information, introduced_in_chapter: 13 }
      - name: unwinding
        introduced_in_chapter: 13
        note: "Introduced as 'stack unwinding' in Chapter 13's New Concepts."
      - name: frame pointer
        introduced_in_chapter: 13
        note: "Introduced as 'frame pointers' in Chapter 13's New Concepts."
      - { name: call graph, introduced_in_chapter: 12 }
      - { name: flame graph, introduced_in_chapter: 14 }
      - { name: differential flame graph, introduced_in_chapter: 15 }
      - { name: annotation, introduced_in_chapter: 12 }

  - level: 4
    name: "Memory Behavior"
    concepts:
      - { name: cache line, introduced_in_chapter: 16 }
      - { name: L1/L2/LLC, introduced_in_chapter: 16 }
      - { name: locality, introduced_in_chapter: 16 }
      - { name: working set, introduced_in_chapter: 17 }
      - { name: cache hit, introduced_in_chapter: 17 }
      - name: cache miss
        introduced_in_chapter: 17
        note: "Introduced via 'compulsory miss' and 'capacity miss intuition' in Chapter 17's New Concepts."
      - name: prefetching
        introduced_in_chapter: 17
        note: "Introduced via 'prefetcher' in Chapter 17's New Concepts."
      - { name: coherence, introduced_in_chapter: 18 }
      - { name: false sharing, introduced_in_chapter: 18 }
      - { name: memory-level parallelism, introduced_in_chapter: 19 }
      - name: memory bandwidth
        introduced_in_chapter: 19
        note: "Introduced via 'sustained bandwidth'/'peak bandwidth' in Chapter 19's New Concepts."
      - name: memory latency
        introduced_in_chapter: 16
        note: "Introduced as 'latency' in Chapter 16's New Concepts."
      - { name: uncore, introduced_in_chapter: 20 }
      - { name: roofline intuition, introduced_in_chapter: 19 }

  - level: 5
    name: "Topology and Placement"
    concepts:
      - name: core
        introduced_in_chapter: 23
        note: "Introduced as 'physical core' in Chapter 23's New Concepts."
      - { name: logical CPU, introduced_in_chapter: 23 }
      - name: SMT
        introduced_in_chapter: 23
        note: "Introduced as 'SMT sibling' in Chapter 23's New Concepts."
      - { name: socket, introduced_in_chapter: 23 }
      - { name: CPU affinity, introduced_in_chapter: 23 }
      - { name: cpuset, introduced_in_chapter: 23 }
      - name: cgroup
        introduced_in_chapter: 23
        note: "Introduced as 'cgroup CPU constraints' in Chapter 23's New Concepts."
      - { name: isolation, introduced_in_chapter: 23 }
      - { name: NUMA node, introduced_in_chapter: 24 }
      - name: NUMA distance
        introduced_in_chapter: 24
        note: "Introduced as 'distance' in Chapter 24's New Concepts."
      - { name: first-touch allocation, introduced_in_chapter: 25 }
      - { name: local memory, introduced_in_chapter: 24 }
      - { name: remote memory, introduced_in_chapter: 24 }
      - name: memory policy
        introduced_in_chapter: 25
        note: "Introduced via 'local allocation policy'/'interleave'/'bind'/'preferred node' in Chapter 25's New Concepts."
      - { name: page migration, introduced_in_chapter: 25 }

  - level: 6
    name: "Dynamic Tracing"
    concepts:
      - { name: event, introduced_in_chapter: 26 }
      - { name: tracepoint, introduced_in_chapter: 26 }
      - { name: kprobe, introduced_in_chapter: 26 }
      - { name: kretprobe, introduced_in_chapter: 26 }
      - { name: uprobe, introduced_in_chapter: 26 }
      - { name: USDT, introduced_in_chapter: 26 }
      - { name: eBPF program, introduced_in_chapter: 27 }
      - { name: verifier, introduced_in_chapter: 27 }
      - { name: map, introduced_in_chapter: 27 }
      - { name: helper, introduced_in_chapter: 27 }
      - name: attachment point
        introduced_in_chapter: 27
        note: "Introduced via 'hook', the surface term BLUEPRINT.md's own Chapter 27 Introduces line uses; same concept as the Level 6 seed list's 'attachment point'."
      - { name: ring buffer, introduced_in_chapter: 27 }
      - { name: histogram, introduced_in_chapter: 28 }
      - { name: BTF, introduced_in_chapter: 27 }
      - { name: CO-RE, introduced_in_chapter: 27 }
      - { name: BCC, introduced_in_chapter: 28 }
      - { name: bpftrace, introduced_in_chapter: 28 }

  - level: 7
    name: "Whole-System Diagnosis"
    concepts:
      - name: on-CPU time
        introduced_in_chapter: 29
        also_appears_in: [1, 21]
        note: "Ch1/Ch21 use 'on-CPU'/'off-CPU' informally to establish the time-accounting problem; formal treatment completed in Ch29."
      - name: off-CPU time
        introduced_in_chapter: 29
        also_appears_in: [1, 21]
      - { name: wake-up latency, introduced_in_chapter: 29 }
      - { name: lock contention, introduced_in_chapter: 29 }
      - name: futex
        introduced_in_chapter: 29
        note: "Introduced as 'futex wait', the specific mechanism pthread_mutex uses."
      - name: I/O latency
        introduced_in_chapter: 29
        note: "Introduced via 'block I/O' and its latency (a synchronous read waiting on storage); BLUEPRINT.md's own Ch29 Introduces line uses 'block I/O', the Level 7 seed list uses 'I/O latency' -- same concept."
      - { name: queueing delay, introduced_in_chapter: 29 }
      - name: interference
        introduced_in_chapter: 30
        also_appears_in: [22]
        note: "Ch22's own title and lab ('noisy neighbor') use 'interference' informally well before Level 7 is reached; formally completed in Ch30's Core Intuition, tying back to Ch22 explicitly."
      - name: bottleneck shift
        introduced_in_chapter: 30
        also_appears_in: [5]
        note: "Ch5 uses 'bottleneck shift' operationally as step 9 of the investigation loop; formally completed in Ch30's Core Intuition, tied directly to the case study's Step 5 (lock contention to memory bandwidth)."
      - { name: regression, introduced_in_chapter: 30 }
      - { name: scalability, introduced_in_chapter: 30 }
      - name: tail latency
        introduced_in_chapter: 3
        note: "BLUEPRINT.md lists 'tail latency' at both Level 0/3-adjacent Ch3 Introduces and formal Level 7. Treated as introduced in Ch3 (matches the Section 11 per-chapter outline), with Level 7 representing its full whole-system treatment in Part VII."
      - name: causal claim
        introduced_in_chapter: 30
        also_appears_in: [5]
        note: "Ch5 uses 'causal claim' operationally in the investigation loop; formally completed in Ch30's Core Intuition and reflected directly in its Key Takeaway."

rules:
  - "No chapter may rely on a concept before its prerequisites have been introduced (Section 11)."
  - "Dependency is level-ordered: a concept at level N may assume all concepts at levels < N."
  - "Chapters 1-30 are now fully drafted. All of Levels 2-7 have every concept formally introduced. Level 0's 'metric' and 'measurement overhead' and Level 1's 'process', 'thread', 'user time', 'system time', 'wall time' remain introduced_in_chapter: null by deliberate choice carried forward from earlier phases -- BLUEPRINT.md's own Chapter 1-5 outlines use these terms informally throughout Part I without a single chapter claiming to formally define them, and no later chapter does either; see concept-graph.md for the full discussion."

narrative_graph:
  # BLUEPRINT.md Section 12 -- one chain of 30 questions, each tagged with
  # its chapter. All 30 are drafted -- the full book is complete.
  - { n: 1, question: "Why can a program feel slow when no obvious resource is fully used?", chapter: 1 }
  - { n: 2, question: "What exactly does \"faster\" mean for this workload?", chapter: 2 }
  - { n: 3, question: "How do latency, throughput, utilization, and saturation differ?", chapter: 3 }
  - { n: 4, question: "How do we know a measured difference is real?", chapter: 4 }
  - { n: 5, question: "What investigation process prevents random tuning?", chapter: 5 }
  - { n: 6, question: "What work does the CPU actually execute?", chapter: 6 }
  - { n: 7, question: "What do cycles and instructions tell us?", chapter: 7 }
  - { n: 8, question: "Why can a CPU spend cycles without retiring useful work?", chapter: 8 }
  - { n: 9, question: "How do branches and dependencies disrupt execution?", chapter: 9 }
  - { n: 10, question: "How can counters turn a vague slowdown into a hypothesis?", chapter: 10 }
  - { n: 11, question: "When should we count, sample, or trace?", chapter: 11 }
  - { n: 12, question: "Which functions and code paths consume CPU time?", chapter: 12 }
  - { n: 13, question: "Why are call stacks sometimes missing or wrong?", chapter: 13 }
  - { n: 14, question: "How do flame graphs show the shape of work?", chapter: 14 }
  - { n: 15, question: "How do we prove that an optimization changed the right thing?", chapter: 15 }
  - { n: 16, question: "Why can memory access dominate code that performs little computation?", chapter: 16 }
  - { n: 17, question: "Why do access order and working-set size change performance?", chapter: 17 }
  - { n: 18, question: "How can independent threads slow each other through cache coherence?", chapter: 18 }
  - { n: 19, question: "How do we tell whether a workload is limited by memory bandwidth?", chapter: 19 }
  - { n: 20, question: "Which tools reveal cache and memory behavior?", chapter: 20 }
  - { n: 21, question: "How does Linux decide where runnable work executes?", chapter: 21 }
  - { n: 22, question: "How do migrations and neighboring workloads add noise and delay?", chapter: 22 }
  - { n: 23, question: "When does CPU affinity help, hurt, or merely hide a problem?", chapter: 23 }
  - { n: 24, question: "Why is some memory farther away than other memory?", chapter: 24 }
  - { n: 25, question: "How do allocation and execution placement interact on NUMA systems?", chapter: 25 }
  - { n: 26, question: "What can dynamic tracing observe that counters and sampling cannot?", chapter: 26 }
  - { n: 27, question: "How can eBPF safely run custom measurements inside the kernel?", chapter: 27 }
  - { n: 28, question: "How do bpftrace and BCC turn questions into live instrumentation?", chapter: 28 }
  - { n: 29, question: "Where does time go when a thread is not on a CPU?", chapter: 29 }
  - { n: 30, question: "How do all the layers combine into one defensible investigation?", chapter: 30 }

